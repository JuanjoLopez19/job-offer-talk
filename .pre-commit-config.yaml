repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        files: ^app/
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        files: ^(app|tests)/
        pass_filenames: false
